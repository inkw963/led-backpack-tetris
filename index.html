<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>LED Backpack Tetris</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;--bg:#080b12;--button:#172238;--border:#384c70;--accent:#63c8ff;--pressed:#2973b9;--bad:#ff6b78}
    *{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
    html,body{width:100%;height:100%;overscroll-behavior:none}
    body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:#eef3ff;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    main{height:100%;min-height:0;display:grid;grid-template-rows:30px minmax(0,1fr);gap:6px;padding:0 8px 8px}
    .status{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px;font:800 11px/1 ui-monospace,monospace;letter-spacing:.04em;white-space:nowrap}
    #connection{overflow:hidden;text-overflow:ellipsis;color:var(--bad)} #connection.connected{color:var(--accent)}
    .tiny{min-height:26px;min-width:40px;border-radius:8px;padding:2px 8px;font-size:12px;box-shadow:none}
    .controls{min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(72px,1fr) minmax(72px,1fr) minmax(72px,.85fr) minmax(72px,.62fr);gap:8px}
    button{min-width:0;min-height:72px;border:1px solid var(--border);border-radius:14px;background:var(--button);color:#fff;font:800 clamp(17px,5vw,24px)/1 system-ui,sans-serif;padding:6px;box-shadow:0 3px 0 #0b111d;transition:transform 50ms,background-color 50ms,border-color 50ms,box-shadow 50ms}
    button.active,button:active{transform:translateY(3px);background:var(--pressed);border-color:var(--accent);box-shadow:0 0 0 #0b111d,inset 0 0 16px rgb(99 200 255/24%)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    [data-action=rotate_ccw]{grid-column:1/3}[data-action=rotate_cw]{grid-column:3/5}[data-action=hold]{grid-column:5/7}
    [data-action=left]{grid-column:1/3}[data-action=soft_drop]{grid-column:3/5}[data-action=right]{grid-column:5/7}
    [data-action=hard_drop]{grid-column:1/7;background:#543074}
    [data-action=pause]{grid-column:1/4;font-size:clamp(14px,4vw,18px)} [data-action=start]{grid-column:4/7;background:#17633e;font-size:clamp(14px,4vw,18px)}
    .overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/72%)} .overlay[hidden]{display:none}
    .panel{width:min(420px,100%);max-height:100%;overflow:auto;border:1px solid var(--border);border-radius:16px;background:#101725;padding:18px;box-shadow:0 16px 50px #000}
    .panel h1{margin:0 0 14px;font-size:20px}.panel label{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:12px;margin:10px 0}.panel input{width:100%;min-height:42px;border:1px solid var(--border);border-radius:8px;background:#080b12;color:#fff;font-size:17px;padding:6px}
    .check{grid-template-columns:auto 1fr!important}.check input{width:22px;min-height:22px}.error{min-height:2.5em;color:var(--bad);font-size:13px}.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel-actions button{min-height:52px;font-size:16px}
    #unsupported{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:var(--bg);text-align:center;line-height:1.7} #unsupported[hidden]{display:none}
  </style>
</head>
<body>
<main>
  <div class="status">
    <button id="connect" class="tiny" type="button">接続</button>
    <span id="connection" role="status" aria-live="polite">未接続 / 0 pkt/s</span>
    <button id="settings-open" class="tiny" type="button" aria-label="設定">⚙</button>
  </div>
  <section class="controls" aria-label="Tetris controls">
    <button data-action="rotate_ccw">↶ CCW</button><button data-action="rotate_cw">↷ CW</button><button data-action="hold">HOLD</button>
    <button data-action="left" aria-label="左">←</button><button data-action="soft_drop" aria-label="下">↓</button><button data-action="right" aria-label="右">→</button>
    <button data-action="hard_drop">DROP</button><button data-action="pause">PAUSE</button><button data-action="start">START</button>
  </section>
</main>
<div id="settings" class="overlay" hidden>
  <form class="panel" id="settings-form">
    <h1>設定</h1>
    <label class="check"><input id="all-devices" type="checkbox"><span>すべてのデバイスを表示</span></label>
    <label>盤面 cols<input name="cols" type="number" min="4" max="64" required></label>
    <label>盤面 rows<input name="rows" type="number" min="4" max="64" required></label>
    <label>cell_w<input name="cell_w" type="number" min="1" max="16" required></label>
    <label>cell_h<input name="cell_h" type="number" min="1" max="16" required></label>
    <label>輝度 (0–15)<input name="brightness" type="number" min="0" max="15" required></label>
    <label>描画 fps (1–30)<input name="fps" type="number" min="1" max="30" required></label>
    <div id="settings-error" class="error"></div>
    <div class="panel-actions"><button type="button" id="settings-close">閉じる</button><button type="submit">適用</button></div>
  </form>
</div>
<div id="unsupported" hidden>Web Bluetooth に対応していません。<br>Android は Chrome、iOS は Bluefy が必要です。</div>

  function diffCommands(a,b,full=false){const groups=new Map;if(full){const counts=new Map;for(const row of b.pixels)for(const c of row)counts.set(key(c),(counts.get(key(c))||0)+1);const bg=[...counts].sort((x,y)=>y[1]-x[1])[0][0].split(',').map(Number);const out=[P.cmdRtDrawRect(bg,0,0,63,63)];for(let y=0;y<64;y++)for(let x=0;x<64;x++){const c=b.pixels[y][x];if(!same(c,bg)){const k=key(c);if(!groups.has(k))groups.set(k,[]);groups.get(k).push([x,y])}}for(const [k,pts] of groups)out.push(...colorCommands(pts,k.split(',').map(Number)));return out}for(let y=0;y<64;y++)for(let x=0;x<64;x++)if(!same(a.pixels[y][x],b.pixels[y][x])){const c=b.pixels[y][x],k=key(c);if(!groups.has(k))groups.set(k,[]);groups.get(k).push([x,y])}const out=[];for(const [k,pts] of groups)out.push(...colorCommands(pts,k.split(',').map(Number)));return out}
  function packCommands(commands){const packets=[];let parts=[],size=0;for(const c of commands){if(size&&size+c.payload.length>400){packets.push(parts);parts=[];size=0}parts.push(c.payload);size+=c.payload.length}if(parts.length)packets.push(parts);return packets.map(parts=>{const n=parts.reduce((s,p)=>s+p.length,0),payload=new Uint8Array(n);let at=0;for(const p of parts){payload.set(p,at);at+=p.length}return{payload,mode:2}})}
  class Ble{
    constructor(){this.device=null;this.server=null;this.write=null;this.notify=null;this.sno=1;this.chain=Promise.resolve();this.lastStart=0;this.sent=[];this.reconnecting=false;this.restoring=false}
    status(text,ok=false){connection.textContent=`${text} / ${this.rate()} pkt/s`;connection.classList.toggle('connected',ok)}
    rate(){const now=performance.now();this.sent=this.sent.filter(t=>t>=now-1000);return this.sent.length}
    async choose(){const all=document.querySelector('#all-devices').checked,options=all?{acceptAllDevices:true,optionalServices:[SERVICE]}:{filters:[{namePrefix:'YS'}],optionalServices:[SERVICE]};this.device=await navigator.bluetooth.requestDevice(options);this.device.addEventListener('gattserverdisconnected',()=>this.disconnected());await this.connectGatt();await this.restore()}
    async connectGatt(){this.status('接続中');this.server=await this.device.gatt.connect();const service=await this.server.getPrimaryService(SERVICE);this.write=await service.getCharacteristic(WRITE);try{this.notify=await service.getCharacteristic(NOTIFY);await this.notify.startNotifications()}catch(e){console.warn('Notify unavailable',e)}this.status(`接続 ${this.device.name||''}`,true)}
    enqueue(command){const frame=P.buildFrame(command.payload,this.sno++,command.mode);const task=this.chain.then(()=>this.transmit(frame));this.chain=task.catch(()=>{});return task}
    async transmit(frame){if(!this.write||!this.device?.gatt.connected)throw new Error('BLE disconnected');const wait=25-(performance.now()-this.lastStart);if(wait>0)await sleep(wait);this.lastStart=performance.now();for(let at=0;at<frame.length;at+=180){await this.write.writeValueWithoutResponse(frame.slice(at,at+180));if(at+180<frame.length)await sleep(10)}this.sent.push(performance.now())}
    async restore(){this.restoring=true;try{await this.enqueue(P.cmdLight(settings.brightness));await this.enqueue(P.cmdGame(16));render(game,current);const packets=packCommands(diffCommands(new FrameBuffer,current,true));for(let at=0;at<packets.length;at+=3){for(const packet of packets.slice(at,at+3))await this.enqueue(packet);if(at+3<packets.length)await sleep(1000/settings.fps)}previous=current.copy();pending=[];pendingSnapshot=null;forceFull=false}finally{this.restoring=false}}
    disconnected(){this.write=null;this.status('切断・再接続待機');if(!this.reconnecting)this.reconnect()}
    async reconnect(){this.reconnecting=true;for(let i=0;i<5;i++){await sleep(Math.min(2**i,8)*1000);try{await this.connectGatt();await this.restore();this.reconnecting=false;return}catch(e){this.status(`再接続 ${i+1}/5 失敗`)}}this.reconnecting=false;this.status('再接続失敗')}
  }
  const defaults={cols:16,rows:16,cell_w:4,cell_h:4,brightness:8,fps:10};let settings={...defaults};try{settings={...settings,...JSON.parse(localStorage.getItem('led-backpack-tetris')||'{}')}}catch{}
  let game=new Game(settings.cols,settings.rows),current=new FrameBuffer,previous=new FrameBuffer,pending=[],pendingSnapshot=null,forceFull=true,lastDraw=0,drawing=false,ble=new Ble;
  const connection=document.querySelector('#connection'),form=document.querySelector('#settings-form'),overlay=document.querySelector('#settings'),error=document.querySelector('#settings-error');
  function showSettings(){for(const k of Object.keys(defaults))form.elements[k].value=settings[k];error.textContent='';overlay.hidden=false}
  document.querySelector('#settings-open').addEventListener('click',showSettings);document.querySelector('#settings-close').addEventListener('click',()=>overlay.hidden=true);
  form.addEventListener('submit',e=>{e.preventDefault();const next={};for(const k of Object.keys(defaults))next[k]=Number(form.elements[k].value);if(!Object.values(next).every(Number.isInteger)){error.textContent='すべて整数で入力してください。';return}if(next.cols*next.cell_w>64||next.rows*next.cell_h>64){error.textContent=`盤面 ${next.cols*next.cell_w}×${next.rows*next.cell_h} は 64×64 に収まりません。`;return}if(next.cols<4||next.rows<4||next.cell_w<1||next.cell_h<1||next.brightness<0||next.brightness>15||next.fps<1||next.fps>30){error.textContent='入力範囲を確認してください。';return}const resized=next.cols!==settings.cols||next.rows!==settings.rows;settings=next;localStorage.setItem('led-backpack-tetris',JSON.stringify(settings));if(resized)game=new Game(settings.cols,settings.rows);forceFull=true;pending=[];previous=new FrameBuffer;if(ble.device?.gatt.connected)ble.enqueue(P.cmdLight(settings.brightness)).catch(report);overlay.hidden=true});
  function report(e){console.error(e);ble.status(e?.message||'エラー')}
  document.querySelector('#connect').addEventListener('click',()=>ble.choose().catch(report));
  document.querySelectorAll('button[data-action]').forEach(button=>{const action=button.dataset.action;let active=false;const down=e=>{e.preventDefault();if(active)return;active=true;button.classList.add('active');game.input(action,true)},up=e=>{e.preventDefault();if(!active)return;active=false;button.classList.remove('active');game.input(action,false)};button.addEventListener('touchstart',down,{passive:false});button.addEventListener('touchend',up,{passive:false});button.addEventListener('touchcancel',up,{passive:false});button.addEventListener('mousedown',down);button.addEventListener('mouseup',up);button.addEventListener('mouseleave',up);button.addEventListener('contextmenu',e=>e.preventDefault())});
  const keys={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'soft_drop',KeyZ:'rotate_ccw',KeyX:'rotate_cw',Space:'hard_drop',ShiftLeft:'hold',ShiftRight:'hold',Escape:'pause',Enter:'start'},held=new Set;addEventListener('keydown',e=>{const a=keys[e.code];if(!a||held.has(e.code))return;e.preventDefault();held.add(e.code);game.input(a,true)});addEventListener('keyup',e=>{const a=keys[e.code];if(!a)return;e.preventDefault();held.delete(e.code);game.input(a,false)});addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  async function draw(now){if(drawing||ble.restoring||!ble.device?.gatt.connected||now-lastDraw<1000/settings.fps)return;drawing=true;lastDraw=now;try{if(!pending.length){render(game,current);const commands=diffCommands(previous,current,forceFull);if(!commands.length)return;pending=packCommands(commands);pendingSnapshot=current.copy();forceFull=false}const batch=pending.splice(0,3);try{for(const c of batch)await ble.enqueue(c);if(!pending.length&&pendingSnapshot){previous=pendingSnapshot;pendingSnapshot=null}}catch(e){pending.unshift(...batch);report(e)}}finally{drawing=false}}
  let last=performance.now(),acc=0;function loop(now){acc+=Math.min(now-last,100);last=now;while(acc>=1000/60){game.step(1000/60);acc-=1000/60}draw(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);setInterval(()=>ble.status(ble.device?.gatt.connected?`接続 ${ble.device.name||''}`:ble.reconnecting?'再接続中':'未接続',!!ble.device?.gatt.connected),250);
  if(!navigator.bluetooth)document.querySelector('#unsupported').hidden=false;
})();
