<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="build" content="2026-08-20c">
  <title>LED Backpack Tetris</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;--bg:#080b12;--button:#172238;--border:#384c70;--accent:#63c8ff;--pressed:#2973b9;--bad:#ff6b78}
    *{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
    html,body{width:100%;height:100%;overscroll-behavior:none}
    body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);color:#eef3ff;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    main{height:100%;min-height:0;display:grid;grid-template-rows:30px minmax(0,1fr);gap:6px;padding:0 8px 8px}
    .status{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;align-items:center;gap:5px;font:800 11px/1 ui-monospace,monospace;letter-spacing:.04em;white-space:nowrap}
    #connection{overflow:hidden;text-overflow:ellipsis;color:var(--bad)} #connection.connected{color:var(--accent)}
    .tiny{min-height:26px;min-width:34px;border-radius:8px;padding:2px 7px;font-size:12px;box-shadow:none}.tiny[hidden]{display:none}
    .controls{min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(72px,1fr) minmax(72px,1fr) minmax(72px,.85fr) minmax(72px,.62fr);gap:8px}
    button{min-width:0;min-height:72px;border:1px solid var(--border);border-radius:14px;background:var(--button);color:#fff;font:800 clamp(17px,5vw,24px)/1 system-ui,sans-serif;padding:6px;box-shadow:0 3px 0 #0b111d;transition:transform 50ms,background-color 50ms,border-color 50ms,box-shadow 50ms}
    button.active,button:active{transform:translateY(3px);background:var(--pressed);border-color:var(--accent);box-shadow:0 0 0 #0b111d,inset 0 0 16px rgb(99 200 255/24%)}
    button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    [data-action=rotate_ccw]{grid-column:1/3}[data-action=rotate_cw]{grid-column:3/5}[data-action=hold]{grid-column:5/7}
    [data-action=left]{grid-column:1/3}[data-action=soft_drop]{grid-column:3/5}[data-action=right]{grid-column:5/7}
    [data-action=hard_drop]{grid-column:1/7;background:#543074}
    [data-action=pause]{grid-column:1/4;font-size:clamp(14px,4vw,18px)} [data-action=start]{grid-column:4/7;background:#17633e;font-size:clamp(14px,4vw,18px)}
    .overlay{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgb(0 0 0/72%)} .overlay[hidden]{display:none}
    .panel{width:min(420px,100%);max-height:100%;overflow:auto;border:1px solid var(--border);border-radius:16px;background:#101725;padding:18px;box-shadow:0 16px 50px #000}
    .panel h1{margin:0 0 14px;font-size:20px}.panel label{display:grid;grid-template-columns:1fr 100px;align-items:center;gap:12px;margin:10px 0}.panel input{width:100%;min-height:42px;border:1px solid var(--border);border-radius:8px;background:#080b12;color:#fff;font-size:17px;padding:6px}
    .check{grid-template-columns:auto 1fr!important}.check input{width:22px;min-height:22px}.error{min-height:2.5em;color:var(--bad);font-size:13px}.notice{margin:0 0 12px;color:var(--accent);font-size:13px}.settings-preview{margin:14px 0;padding:10px;border:1px solid var(--border);border-radius:8px;background:#080b12;font:13px/1.4 ui-monospace,monospace}.settings-preview.warning{border-color:var(--bad);color:var(--bad)}.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel-actions button{min-height:52px;font-size:16px}#settings-reset{width:100%;min-height:44px;margin-bottom:8px;font-size:14px}.build-note{display:block;margin-top:12px;text-align:right;font:11px/1.2 ui-monospace,monospace;opacity:.65}
    #diagnostics .panel{display:grid;grid-template-rows:auto auto minmax(120px,1fr);width:min(620px,100%);height:min(80dvh,680px)}#diagnostics h1{display:flex;align-items:center;justify-content:space-between;gap:8px}#diagnostics h1 button{min-height:40px;font-size:14px}#diagnostic-log{min-height:0;overflow:auto;margin:0;padding:10px;border:1px solid var(--border);border-radius:8px;background:#080b12;color:#dce8ff;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;user-select:text;-webkit-user-select:text;touch-action:pan-y}#diagnostic-fallback{width:100%;min-height:90px;margin-top:8px;background:#080b12;color:#fff;user-select:text;-webkit-user-select:text;touch-action:pan-y}
    #unsupported{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:var(--bg);text-align:center;line-height:1.7} #unsupported[hidden]{display:none}
  </style>
</head>
<body>
<main>
  <div class="status">
    <button id="connect" class="tiny" type="button">接続</button>
    <span id="connection" role="status" aria-live="polite"><span id="connection-label">未接続</span> / <span id="packet-rate">0</span> pkt/s</span>
    <button id="retry" class="tiny" type="button" hidden>再試行</button>
    <button id="disconnect" class="tiny" type="button" hidden>切断</button>
    <button id="diagnostics-open" class="tiny" type="button" aria-label="診断ログ">☷</button>
    <button id="settings-open" class="tiny" type="button" aria-label="設定">⚙</button>
  </div>
  <section class="controls" aria-label="Tetris controls">
    <button data-action="rotate_ccw">↶ CCW</button><button data-action="rotate_cw">↷ CW</button><button data-action="hold">HOLD</button>
    <button data-action="left" aria-label="左">←</button><button data-action="soft_drop" aria-label="下">↓</button><button data-action="right" aria-label="右">→</button>
    <button data-action="hard_drop">DROP</button><button data-action="pause">PAUSE</button><button data-action="start">START</button>
  </section>
</main>
<div id="settings" class="overlay" hidden>
  <form class="panel" id="settings-form">
    <h1>設定</h1>
    <div id="settings-migration" class="notice" role="status" hidden></div>
    <label class="check"><input id="all-devices" type="checkbox"><span>すべてのデバイスを表示</span></label>
    <label>盤面 cols<input name="cols" type="number" min="4" max="64" required></label>
    <label>盤面 rows<input name="rows" type="number" min="4" max="64" required></label>
    <label>cell_w<input name="cell_w" type="number" min="1" max="16" required></label>
    <label>cell_h<input name="cell_h" type="number" min="1" max="16" required></label>
    <label class="check"><input name="sidebar" type="checkbox"><span>LED サイドバー (NEXT / SCORE)</span></label>
    <label>ソフトドロップ ms<input name="soft_drop_ms" type="number" min="40" max="400" step="1" required></label>
    <label>輝度 (0–15)<input name="brightness" type="number" min="0" max="15" required></label>
    <label>描画 fps (1–30)<input name="fps" type="number" min="1" max="30" required></label>
    <div id="layout-preview" class="settings-preview" aria-live="polite"></div>
    <div id="settings-error" class="error"></div>
    <button type="button" id="settings-reset">既定に戻す</button>
    <div class="panel-actions"><button type="button" id="settings-close">閉じる</button><button type="submit">適用</button></div>
    <small id="settings-build" class="build-note"></small>
  </form>
</div>
<div id="diagnostics" class="overlay" hidden>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="diagnostics-title">
    <h1 id="diagnostics-title">診断ログ <span id="build-tag" style="font-size:.7em;opacity:.7;font-weight:400"></span> <button type="button" id="diagnostics-close">閉じる</button></h1>
    <div class="panel-actions"><button type="button" id="diagnostics-copy">ログをコピー</button><button type="button" id="diagnostics-clear">ログを消去</button></div>
    <pre id="diagnostic-log" tabindex="0"></pre>
    <textarea id="diagnostic-fallback" hidden readonly aria-label="コピー用診断ログ"></textarea>
  </section>
</div>
<div id="unsupported" hidden>Web Bluetooth に対応していません。<br>Android は Chrome、iOS は Bluefy が必要です。</div>

  async function draw(now){if(drawing||ble.state!=='connected'||now-lastDraw<1000/settings.fps)return;drawing=true;lastDraw=now;try{if(!pending.length){render(game,current);const commands=diffCommands(previous,current,forceFull);if(!commands.length)return;pending=packCommands(commands);pendingSnapshot=current.copy();forceFull=false}const batch=pending.splice(0,3);try{for(const c of batch)await ble.enqueue(c);if(!pending.length&&pendingSnapshot){previous=pendingSnapshot;pendingSnapshot=null}}catch(e){pending.unshift(...batch);report(e)}}finally{drawing=false}}
  let last=performance.now(),acc=0;function loop(now){acc+=Math.min(now-last,100);last=now;while(acc>=1000/60){game.step(1000/60);acc-=1000/60}draw(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);setInterval(()=>{document.querySelector('#packet-rate').textContent=ble.rate()},250);diagnostics.add('state initialized: idle');
  if(!navigator.bluetooth)document.querySelector('#unsupported').hidden=false;
})();
